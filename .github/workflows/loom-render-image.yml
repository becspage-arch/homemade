name: Build loom-render image

# Builds the headless Blender container (apps/web/scripts/loom-render/Dockerfile)
# and pushes it to the ECR repo homemade/loom-render. GitHub's runner has
# Docker, so this is where the image is built (no local Docker needed). Run
# manually after the CDK stack has created the ECR repo, or whenever either
# render script (loom_render.py / loom_render_crochet.py) or the Dockerfile
# change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/scripts/loom_render.py'
      - 'apps/web/scripts/loom_render_crochet.py'
      - 'apps/web/scripts/loom-render/**'
      - '.github/workflows/loom-render-image.yml'

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: homemade/loom-render
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: loom-render-image
  cancel-in-progress: false

jobs:
  build:
    name: Build & push loom-render image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          # Context is apps/web/scripts so the Dockerfile can COPY the
          # unchanged render scripts alongside loom-render/entrypoint.sh.
          context: apps/web/scripts
          file: apps/web/scripts/loom-render/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
