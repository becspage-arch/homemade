name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.json'
      - 'Dockerfile'
      - 'Dockerfile.*'
      - 'next.config.*'
      - 'prisma.config.ts'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: homemade/web
  ECS_CLUSTER: homemade
  ECS_SERVICE: homemade-web
  # Forces actions that still ship Node 20 entrypoints (aws-actions/*,
  # docker/*) to run on Node 24. Removable once those actions update.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to ECS
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG_SLUG=${{ secrets.SENTRY_ORG_SLUG }}
            SENTRY_PROJECT_SLUG=${{ secrets.SENTRY_PROJECT_SLUG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Database migrations ──
      # Runs BEFORE ECS rollout so the new container code finds the migrated
      # schema. Idempotent — a no-op when no migrations are pending.
      #
      # pnpm/action-setup MUST come before actions/setup-node — v5 of
      # setup-node turned on the package-manager cache by default, which
      # tries to run pnpm during setup. Without pnpm already on PATH the
      # step fails with "Unable to locate executable file: pnpm".
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.0.9'
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install @homemade/db deps for migrate step
        run: pnpm install --filter @homemade/db --frozen-lockfile

      # Lint blocks the deploy. Phase 2 of the ESLint migration tightened
      # the rules downgraded in Phase 1 and fixed the violations behind
      # them, so a lint failure now means real new debt rather than legacy
      # noise — fail fast instead of letting it merge.
      - name: Install @homemade/web deps for lint
        run: pnpm install --filter @homemade/web --frozen-lockfile

      - name: Lint @homemade/web
        run: pnpm --filter @homemade/web lint

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          # Fall back to stripping -pooler from DATABASE_URL if DIRECT_URL secret not yet set.
          export DIRECT_URL="${DIRECT_URL:-${DATABASE_URL/-pooler./.}}"
          pnpm --filter @homemade/db migrate:deploy

      # Pattern Studio data backfills (phase_pattern_studio_001).
      # Both scripts are idempotent: the seed upserts on Pattern.slug,
      # and the chart migration only touches Tutorial body nodes still
      # typed `crossStitchChart` (already-migrated nodes are
      # `patternInset`). Safe to re-run on every deploy.
      - name: Seed cross-stitch starter patterns (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL="${DATABASE_URL/-pooler./.}"
          pnpm --filter @homemade/db exec tsx scripts/seed-cross-stitch-patterns.ts

      - name: Migrate legacy crossStitchChart nodes to patternInset (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL="${DATABASE_URL/-pooler./.}"
          pnpm --filter @homemade/db exec tsx scripts/migrate-cross-stitch-charts.ts

      # Crochet starter content (phase_crochet_pattern_001 step 2).
      # Publishes the four foundation tutorials that anchor the crochet
      # category — hook-grip + treble + magic-ring + granny-square. Idempotent
      # on slug: upserts row + glossary + chart definition + tool join rows.
      # Re-publishes every deploy so author edits to the JSON files land
      # automatically.
      - name: Publish crochet starter content (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL="${DATABASE_URL/-pooler./.}"
          pnpm --filter @homemade/db exec tsx scripts/seed-crochet-starter-content.ts

      # Crochet pattern rows for Studio Crochet (phase_crochet_pattern_001
      # step 3). Upserts the seed CrochetPattern rows (granny square v1)
      # so /studio/crochet has something to open against. Idempotent on
      # slug; runs every deploy so edits to the seed file land
      # automatically. Depends on the starter-content step having
      # published the source tutorials (the pattern row references
      # sourceTutorialId).
      - name: Seed Studio crochet pattern rows (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL="${DATABASE_URL/-pooler./.}"
          pnpm --filter @homemade/db exec tsx scripts/seed-crochet-pattern-rows.ts

      # Discovery (phase_crochet_pattern_001 step 5). Flips the crochet
      # category to public visibility and marks the four foundation
      # tutorials as foundational so they appear in the Start Here
      # ladder on the /crochet landing page. Idempotent.
      - name: Flip crochet public + foundations (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL="${DATABASE_URL/-pooler./.}"
          pnpm --filter @homemade/db exec tsx scripts/flip-crochet-public.ts

      # Needlework pipeline-setup (phase_needlework_pipeline_setup_001).
      # Sets Category.needlework targetTutorialCount, techniqueSlugs,
      # criticalTechniques, aliases, isPublicVisible; flips
      # SubCategory.autopilotEnabled per discipline (7 true, 3 false for
      # specialist curation). Does NOT set pipelineStatus — the autopilot
      # gate is owned by the per-category sign-off flow + the admin
      # Ready/Paused toggle, so this step no longer re-arms READY on every
      # deploy. Idempotent: re-runs every deploy so the canonical author
      # standards in the script remain the source of truth. Depends on the
      # migration step above having added SubCategory.autopilotEnabled and
      # Category.techniqueSlugs / criticalTechniques / aliases columns.
      - name: Assert needlework pipeline-setup standards (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL="${DATABASE_URL/-pooler./.}"
          pnpm --filter @homemade/db exec tsx scripts/flip-needlework-ready.ts

      # Photographic demo patterns — pulls 3 public-domain Wikimedia
      # photos through the live photo-to-chart pipeline at ~120 cells
      # / ~36 colours so the library shows what dense subject matter
      # looks like through the hero renderer. Idempotent on slug.
      # Continues on failure: a Wikimedia outage shouldn't block the
      # rollout, and a re-run picks the photos up on the next deploy.
      - name: Seed photographic demo patterns (idempotent, non-blocking)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL="${DATABASE_URL/-pooler./.}"
          pnpm --filter @homemade/web exec tsx scripts/seed-photographic-patterns.ts

      # Seed the demo sewing pattern row so /studio/sewing/demo-a-line-skirt
      # and ?demo=1 both resolve. Idempotent on slug. Non-blocking like the
      # photographic seed — a failure shouldn't gate the rollout.
      - name: Seed demo sewing pattern (idempotent, non-blocking)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL="${DATABASE_URL/-pooler./.}"
          pnpm --filter @homemade/web exec tsx scripts/seed-demo-sewing-pattern.ts

      # S-5b/c smoke-test row: Bella body block backed by the freesewing
      # engine wrapper at apps/web/src/lib/sewing/grading/. Idempotent on
      # slug; isFreesewingDesign=true so the Studio dispatches to the
      # SVG-aware viewer + tile pipeline. Non-blocking.
      - name: Seed freesewing showcase patterns (idempotent, non-blocking)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL="${DATABASE_URL/-pooler./.}"
          pnpm --filter @homemade/web exec tsx scripts/seed-freesewing-showcase-patterns.ts

      # S-8a hero-flat batch — renders the finished-garment line drawing
      # for every mapped SewingPattern slug, uploads to R2, attaches the
      # resulting Media row to SewingPattern.heroMediaId. Idempotent on
      # content hash + renderer version, non-blocking so a renderer bug
      # never blocks the deploy.
      - name: Render sewing hero flats (idempotent, non-blocking)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          export DATABASE_URL="${DATABASE_URL/-pooler./.}"
          pnpm --filter @homemade/web exec tsx scripts/render-sewing-hero-flats.ts

      - name: Update ECS service (ensures >=2 tasks and pulls new image)
        # Steady state is 2 tasks — eliminates the ~90s cold-start downtime
        # when a single task crashes (perf-audit-001 issue #8). Must match
        # the CDK desiredCount default in infra/lib/homemade-stack.ts.
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --desired-count 2 \
            --force-new-deployment \
            --no-cli-pager

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}

      - name: Print service status
        run: |
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount,TaskDef:taskDefinition}' \
            --output table
